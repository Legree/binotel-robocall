; === Реєстрація бота як внутрішнього номера Binotel ===
; Дані беруться в My.binotel: Співробітники -> внутрішній номер -> Налаштування SIP.
; Замініть BINOTEL_SIP_HOST, BINOTEL_SIP_LOGIN, BINOTEL_SIP_PASSWORD.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[binotel]
type=registration
outbound_auth=binotel_auth
server_uri=sip:BINOTEL_SIP_HOST
client_uri=sip:BINOTEL_SIP_LOGIN@BINOTEL_SIP_HOST
retry_interval=30
expiration=300
line=yes
endpoint=binotel

[binotel_auth]
type=auth
auth_type=userpass
username=BINOTEL_SIP_LOGIN
password=BINOTEL_SIP_PASSWORD

[binotel]
type=endpoint
context=from-binotel
disallow=all
allow=alaw
allow=ulaw
outbound_auth=binotel_auth
aors=binotel
from_user=BINOTEL_SIP_LOGIN
from_domain=BINOTEL_SIP_HOST
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[binotel]
type=aor
contact=sip:BINOTEL_SIP_HOST
qualify_frequency=60

[binotel]
type=identify
endpoint=binotel
match=BINOTEL_SIP_HOST
