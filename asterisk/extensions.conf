[general]
static=yes
writeprotect=no

; Вхідні на номер бота (на випадок, якщо агент передзвонить) - просто кладемо трубку
[from-binotel]
exten => _X.,1,Answer()
 same => n,Wait(1)
 same => n,Hangup()

; === Сценарій вихідного роботизованого дзвінка ===
; Сюди потрапляє канал агента ПІСЛЯ того, як він зняв трубку (Originate з bot.py).
; Змінна JOB_ID передається з бота, файл ${JOB_ID}.wav лежить у sounds/robocall/.
[robocall]
exten => s,1,NoOp(Robocall job ${JOB_ID} -> ${CALLERID(num)})
 same => n,Set(RESULT=hangup)
 ; 1) Автовідповідач? AMD слухає перші секунди: коротке "Алло" = людина, довгий монолог = робот
 same => n,AMD()
 same => n,GotoIf($["${AMDSTATUS}"="MACHINE"]?machine)
 ; 2) Ворота: спочатку кнопка, потім текст. Робот "1" не натисне.
 same => n,Set(ATTEMPT=0)
 same => n(gate),Read(KEY,robocall/gate,1,,1,5)
 same => n,GotoIf($["${KEY}"="1"]?msg)
 same => n,Set(ATTEMPT=$[${ATTEMPT}+1])
 same => n,GotoIf($[${ATTEMPT}<2]?gate)
 same => n,Set(RESULT=nokey)
 same => n,Hangup()
 ; 3) Жива людина натиснула 1 - зачитуємо повідомлення
 same => n(msg),Playback(robocall/${JOB_ID})
 same => n,Set(RESULT=confirmed)
 same => n,Playback(robocall/thanks)
 same => n,Hangup()
 same => n(machine),Set(RESULT=machine)
 same => n,Hangup()

; h спрацьовує при будь-якому завершенні - віддаємо результат боту
exten => h,1,UserEvent(RobocallResult,JobId: ${JOB_ID},Result: ${RESULT},Duration: ${CDR(billsec)})
